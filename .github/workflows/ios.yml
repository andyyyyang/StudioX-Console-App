# 每次推上來都在 GitHub 的 Mac 上用 Xcode 27 編一次 App（模擬器版、不簽章），
# 編不過就在 Actions 頁面看得到是哪一行。用的是和 Xcode Cloud 同一個共用 scheme（StudioXConsole）。
# 上架 TestFlight 用 Xcode Cloud（見 README「建置與上架」）。
name: iOS build

on:
  push:
    paths:
      - "StudioXConsole/**"
      - "StudioXConsole.xcodeproj/**"
      - "StudioXConsole.entitlements"
      - "ci_scripts/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "StudioXConsole/**"
      - "StudioXConsole.xcodeproj/**"
      - "StudioXConsole.entitlements"
  workflow_dispatch:

# 同一個分支連推好幾次：只編最新的那次（Mac 的分鐘數比較貴）
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 選 Xcode（有 27 用 27，沒有就用最新的）
        run: |
          best=""; bestv="0"
          for app in /Applications/Xcode*.app; do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" 2>/dev/null) || continue
            if [ "$v" != "$bestv" ] && [ "$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -1)" = "$v" ]; then best="$app"; bestv="$v"; fi
          done
          if [ -z "$best" ]; then echo "::error::找不到 Xcode"; exit 1; fi
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          if [ "${bestv%%.*}" -lt 27 ]; then
            # App 的目標是 iOS 27；GitHub 的 Mac 還沒裝 Xcode 27 時先用最新的編，抓得到絕大部分的錯，
            # 只有 iOS 27 才有的 API 會在這裡報「找不到」——那幾個以 Xcode 27 為準
            echo "::warning::這台 runner 還沒有 Xcode 27，先用 Xcode $bestv 編（只有 iOS 27 才有的 API 會在這裡報錯）"
          fi

      - name: 編譯（模擬器、不簽章）
        run: |
          set -o pipefail
          xcodebuild build \
            -project StudioXConsole.xcodeproj \
            -scheme StudioXConsole \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: 錯誤與警告
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "## 錯誤" >> "$GITHUB_STEP_SUMMARY"
            grep -E "^/.*error:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -100 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
            echo "## 警告" >> "$GITHUB_STEP_SUMMARY"
            grep -E "^/.*warning:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -100 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7
