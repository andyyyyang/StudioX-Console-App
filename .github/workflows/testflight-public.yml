# TestFlight 公開測試：建好外部測試群組「公開測試」與公開連結，把最新一個處理好的 build 交給它、送 Apple 的測試版審核。
# 見 ci/testflight_public.py。提交訊息有 [public only] 時跑（不建置）；推新版時要一起給公開測試，提交訊息寫 [public]（testflight.yml）。
# 也可以在 Actions 這一頁 Re-run，查審核結果、拿公開連結。
name: TestFlight 公開測試

on:
  push:
    branches:
      - main
      - claude/ios-app-prototype-4492mf
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-public
  cancel-in-progress: false

jobs:
  public:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[public only]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography
      - name: 公開測試（交給外部測試群組、送審、公開連結）
        run: |
          version=$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' StudioXConsole.xcodeproj/project.pbxproj | awk '{print $3}')
          python3 ci/testflight_public.py --version "$version" --wait 40
