# UI 截圖：在 GitHub 的 Mac 上用模擬器打開 App 的畫面（示範模式的假資料，見 DemoServer.swift），
# 截圖存到 docs/screenshots/，提交回這個分支（也放在這次執行的 artifact）。
# 平常只截 iPhone 深色的主要畫面；手動 Run workflow 選 full 才截全部畫面＋淺色＋iPad。
# talk＝首頁 Xena 說到一半、home＝說完；account＝設定頁；voice＝用說的（示範的字幕）。
# 截圖這一步有自己的時限：逾時也會把已經截到的提交回來（看得到卡在哪一張）。
# 提交訊息有 [screenshots] 才跑（Mac 的分鐘數比較貴），也可以手動 Run workflow。
# [screenshots-ipad]：iPhone 深色的主要畫面＋iPad 深色的全部畫面（看平板的版面）。
# 提交訊息有 [appstore-shots]：App Store 用的截圖——6.9 吋 iPhone（1320×2868）與 13 吋 iPad（2064×2752）、深色、原尺寸，
# 存到 docs/appstore/raw/（宣傳圖在 docs/appstore/ 合成，見 ci/appstore/）。[appstore-shots-ipad] 只重拍 iPad。
name: UI 截圖

on:
  workflow_dispatch:
    inputs:
      full:
        description: "全部畫面＋淺色＋iPad（比較久）"
        type: boolean
        default: false
  push:
    paths:
      - "StudioXConsole/**"
      - "StudioXConsole.xcodeproj/**"
      - ".github/workflows/ui-screenshots.yml"

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]') || contains(github.event.head_commit.message, '[screenshots-ipad]') || contains(github.event.head_commit.message, '[appstore-shots')
    # 放在 job 上：沒有 [screenshots] 的提交（job 跳過）不會取消正在截的那一次
    concurrency:
      group: ui-screenshots-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: 選 Xcode（有 27 用 27，沒有就用最新的）
        run: |
          best=""; bestv="0"
          for app in /Applications/Xcode*.app; do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" 2>/dev/null) || continue
            if [ "$v" != "$bestv" ] && [ "$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -1)" = "$v" ]; then best="$app"; bestv="$v"; fi
          done
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          echo "SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_ENV"

      - name: 編譯（模擬器、Debug，示範模式只在 Debug）
        run: |
          set -o pipefail
          xcodebuild build \
            -project StudioXConsole.xcodeproj \
            -scheme StudioXConsole \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET="$SIM_SDK" \
            2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: 選模擬器
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re
          d = json.load(open("devices.json"))["devices"]
          ios = sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in re.findall(r"\d+", k)])
          devs = [x for k in reversed(ios) for x in d[k]]
          def pick(prefs, kind):
              for p in prefs:
                  for x in devs:
                      if x["name"] == p: return x["udid"]
              for x in devs:
                  if x["name"].startswith(kind): return x["udid"]
          print("IPHONE=" + pick(["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17"], "iPhone"))
          print("IPHONE_MAX=" + pick(["iPhone 17 Pro Max", "iPhone 16 Pro Max", "iPhone Air"], "iPhone"))
          print("IPAD=" + pick(["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)", "iPad Air 13-inch (M3)"], "iPad"))
          PY

      - name: 截圖
        timeout-minutes: 28
        continue-on-error: true
        env:
          FULL: ${{ inputs.full && 'yes' || 'no' }}
          IPADSHOTS: ${{ contains(github.event.head_commit.message, '[screenshots-ipad]') && 'yes' || 'no' }}
          APPSTORE: ${{ contains(github.event.head_commit.message, '[appstore-shots') && 'yes' || 'no' }}
          ONLY: ${{ contains(github.event.head_commit.message, '[appstore-shots-ipad]') && 'ipad' || '' }}
        run: |
          app="build/Build/Products/Debug-iphonesimulator/StudioXConsole.app"
          mkdir -p shots
          # 主要畫面（平常只截這些）
          scenes=(
            "talk|-demo|5"
            "home|-demo|13"
            "sheet|-demo -demoSheet today|9"
            "decisions|-demo -demoSheet today -demoScroll decisions|11"
            "site|-demo -demoRoute site"
            "xena|-demo -demoRoute xena"
            "line|-demo -demoRoute line"
            "tools|-demo -demoRoute line -demoTools YES|10"
            "thread|-demo -demoRoute thread"
            "order|-demo -demoRoute order -demoScroll amounts"
            "member|-demo -demoRoute member"
            "inbox|-demo -demoTab inbox"
            "order-progress|-demo -demoRoute shipped"
            "linepush|-demo -demoRoute linepush"
            "promotion|-demo -demoRoute linepush -demoScroll compose|10"
            "campaign|-demo -demoRoute campaign"
            "pending|-demo -demoRoute pending"
            "report|-demo -demoRoute report|10"
            "report-regions|-demo -demoRoute report -demoScroll regions|12"
            "traffic-names|-demo -demoRoute traffic -demoScroll names|10"
            "console|-demo -demoRoute console"
            "console-site|-demo -demoRoute console-site"
            "console-services|-demo -demoRoute console-services"
            "console-billing|-demo -demoRoute console-billing"
            "console-team|-demo -demoRoute console-team"
            "voice|-demo -demoVoice YES|12"
            "account|-demo -demoTab account"
          )
          if [ "$FULL" = "yes" ] || [ "$IPADSHOTS" = "yes" ]; then
            scenes+=(
              "welcome|"
              "sites|-demo -demoTab sites"
              "traffic|-demo -demoRoute traffic"
              "products|-demo -demoRoute products"
              "product|-demo -demoRoute product"
              "orders|-demo -demoTab orders"
              "order-top|-demo -demoRoute order"
              "lock|-demo -demoLock YES"
            )
          fi
          # App Store 用的畫面（宣傳圖從這些挑）
          if [ "$APPSTORE" = "yes" ]; then
            scenes=(
              "home|-demo|13"
              "talk|-demo|5"
              "voice|-demo -demoVoice YES|12"
              "line|-demo -demoRoute line"
              "inbox|-demo -demoTab inbox"
              "orders|-demo -demoTab orders"
              "order|-demo -demoRoute order"
              "site|-demo -demoRoute site|14"
              "traffic|-demo -demoRoute traffic|12"
              "product|-demo -demoRoute product|14"
              "xena|-demo -demoRoute xena|10"
              "sheet|-demo -demoSheet today|9"
              "lock|-demo -demoLock YES"
            )
          fi
          # 每個指令都有時限（卡住就跳過，不會整個流程卡到逾時）；log 有時間，看得出慢在哪
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          shoot() {
            dev=$1; label=$2; appearance=$3
            echo "== $label $appearance 開機 $(date +%T)"
            limit 60 xcrun simctl boot "$dev" || true
            limit 300 xcrun simctl bootstatus "$dev" -b || true
            limit 30 xcrun simctl status_bar "$dev" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            limit 180 xcrun simctl install "$dev" "$app" || true
            limit 30 xcrun simctl ui "$dev" appearance "$appearance" || true
            if [ "$APPSTORE" = "yes" ]; then
              # 剛開機的系統通知（例如「Ready for Apple Intelligence」）會蓋在畫面上方：先開著 App 等它跳完、收掉
              limit 60 xcrun simctl launch "$dev" tw.studiox.console -demo >/dev/null || true
              sleep 75
            fi
            for scene in "${scenes[@]}"; do
              # 名稱|啟動參數|等幾秒（預設 8；talk 是 Xena 說到一半、home 是說完）
              IFS='|' read -r name args wait <<< "$scene"
              echo "-- $label $appearance $name $(date +%T)"
              limit 20 xcrun simctl terminate "$dev" tw.studiox.console 2>/dev/null || true
              # 模擬器剛開機時有時要搬好幾分鐘資料：打不開等一下再試；還是打不開就跳過這張（不要截到主畫面、開機畫面）
              if ! limit 60 xcrun simctl launch "$dev" tw.studiox.console $args >/dev/null; then
                echo "   啟動逾時，再試一次"
                sleep 20
                limit 60 xcrun simctl launch "$dev" tw.studiox.console $args >/dev/null || { echo "   還是打不開，這張跳過"; continue; }
              fi
              sleep "${wait:-8}"
              limit 30 xcrun simctl io "$dev" screenshot "shots/$label-$appearance-$name.png" >/dev/null 2>&1 || echo "   截圖逾時"
              echo "   完成 $(date +%T)"
            done
            limit 60 xcrun simctl shutdown "$dev" || true
          }
          if [ "$APPSTORE" = "yes" ]; then
            [ "$ONLY" = "ipad" ] || shoot "$IPHONE_MAX" iphone69 dark
            shoot "$IPAD" ipad13 dark
          else
            shoot "$IPHONE" iphone dark
          fi
          if [ "$FULL" = "yes" ]; then
            shoot "$IPHONE" iphone light
            shoot "$IPAD" ipad dark
          elif [ "$IPADSHOTS" = "yes" ]; then
            shoot "$IPAD" ipad dark
          fi
          ls shots | wc -l

      - name: 截圖放在這次執行（逾時也放）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: 縮小、提交回分支
        if: always()
        env:
          APPSTORE: ${{ contains(github.event.head_commit.message, '[appstore-shots') && 'yes' || 'no' }}
          ONLY: ${{ contains(github.event.head_commit.message, '[appstore-shots-ipad]') && 'ipad' || '' }}
        run: |
          ls shots/*.png >/dev/null 2>&1 || { echo "沒有截到"; exit 0; }
          # 先轉好放在旁邊，等一下疊到分支最新的版本上
          out="$RUNNER_TEMP/shots-out"
          mkdir -p "$out"
          if [ "$APPSTORE" = "yes" ]; then
            # App Store 用：原尺寸（高畫質 JPEG，宣傳圖用它合成）
            target=docs/appstore/raw
            for f in shots/*.png; do
              sips -s format jpeg -s formatOptions 92 "$f" --out "$out/$(basename "${f%.png}").jpg" >/dev/null
            done
          else
            target=docs/screenshots
            for f in shots/*.png; do
              sips -Z 1000 -s format jpeg -s formatOptions 70 "$f" --out "$out/$(basename "${f%.png}").jpg" >/dev/null
            done
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 每次都疊在分支最新的版本上（這段時間有人推了、別的截圖先提交了也不會衝突）；
          # 只換這次截到的，沒截到的（逾時、被取消）留著上一次的，不會被刪掉
          # GitHub 偶爾回 500（Internal Server Error）：多試幾次、間隔拉長；都失敗就讓這一步失敗（看得到沒提交）
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard FETCH_HEAD
            mkdir -p "$target"
            cp "$out"/*.jpg "$target"/
            git add "$target"
            if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
            git commit -q -m "UI 截圖（自動）[skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then echo "提交了"; exit 0; fi
            sleep $((i * 15))
          done
          echo "::error::截圖推不回分支（GitHub 一直回錯誤），截圖在這次執行的 artifact"
          exit 1
